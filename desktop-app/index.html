<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca no Ponto - Sistema de Vendas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f5f5;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2563eb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #app-content {
            display: none;
            width: 100%;
            height: 100vh;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1f2937;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-online {
            background: #10b981;
        }
        
        .status-offline {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>Banca no Ponto</h2>
        <p>Iniciando sistema...</p>
        <p id="loading-status">Verificando dependências...</p>
    </div>
    
    <div id="app-content">
        <iframe id="app-frame" src="http://localhost:3000"></iframe>
        <div class="status-bar">
            <div>
                <span class="status-indicator status-offline" id="backend-status"></span>
                <span id="backend-text">Backend: Iniciando...</span>
            </div>
            <div>
                <span id="app-version">Banca no Ponto v1.0.0</span>
            </div>
        </div>
    </div>

    <script>
        const { spawn } = require('child_process');
        const path = require('path');
        const fs = require('fs');

        let backendProcess = null;
        let backendReady = false;
        let retryCount = 0;
        const maxRetries = 30;

        // Função para atualizar status
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('loading-status');
            const backendStatusEl = document.getElementById('backend-status');
            const backendTextEl = document.getElementById('backend-text');
            
            if (statusEl) statusEl.textContent = message;
            
            if (type === 'success') {
                backendStatusEl.className = 'status-indicator status-online';
                backendTextEl.textContent = 'Backend: Online';
            } else if (type === 'error') {
                backendStatusEl.className = 'status-indicator status-offline';
                backendTextEl.textContent = 'Backend: Erro';
            }
        }

        // Função para iniciar o backend
        function startBackend() {
            return new Promise((resolve, reject) => {
                const backendPath = path.join(__dirname, '../backend');
                
                updateStatus('Iniciando servidor backend...');
                
                // Verificar se o backend existe
                if (!fs.existsSync(backendPath)) {
                    reject(new Error('Pasta do backend não encontrada'));
                    return;
                }

                // Verificar se o package.json existe
                const packageJsonPath = path.join(backendPath, 'package.json');
                if (!fs.existsSync(packageJsonPath)) {
                    reject(new Error('package.json do backend não encontrado'));
                    return;
                }

                // Verificar se node_modules existe
                const nodeModulesPath = path.join(backendPath, 'node_modules');
                if (!fs.existsSync(nodeModulesPath)) {
                    updateStatus('Instalando dependências do backend...');
                    // Tentar instalar dependências
                    const npmInstall = spawn('npm', ['install'], {
                        cwd: backendPath,
                        stdio: 'pipe',
                        shell: true
                    });

                    npmInstall.on('close', (code) => {
                        if (code !== 0) {
                            reject(new Error('Falha ao instalar dependências do backend'));
                            return;
                        }
                        // Continuar com a inicialização
                        startBackendProcess();
                    });

                    npmInstall.on('error', (error) => {
                        reject(error);
                    });
                } else {
                    // Iniciar diretamente
                    startBackendProcess();
                }

                function startBackendProcess() {
                    updateStatus('Iniciando processo do backend...');
                    
                    backendProcess = spawn('npm', ['run', 'dev'], {
                        cwd: backendPath,
                        stdio: 'pipe',
                        shell: true
                    });

                    let output = '';
                    
                    backendProcess.stdout.on('data', (data) => {
                        output += data.toString();
                        console.log('Backend:', data.toString());
                        
                        // Verificar se o backend está pronto
                        if (output.includes('Server running on port') || 
                            output.includes('listening on port') ||
                            output.includes('3001')) {
                            backendReady = true;
                            updateStatus('Backend pronto!', 'success');
                            resolve();
                        }
                    });

                    backendProcess.stderr.on('data', (data) => {
                        console.error('Backend Error:', data.toString());
                        output += data.toString();
                    });

                    backendProcess.on('error', (error) => {
                        console.error('Failed to start backend:', error);
                        reject(error);
                    });

                    backendProcess.on('close', (code) => {
                        console.log(`Backend process exited with code ${code}`);
                        if (!backendReady) {
                            reject(new Error('Backend fechou antes de ficar pronto'));
                        }
                    });

                    // Timeout
                    setTimeout(() => {
                        if (!backendReady && backendProcess) {
                            console.log('Timeout: assumindo que backend está funcionando');
                            backendReady = true;
                            updateStatus('Backend iniciado (timeout)', 'success');
                            resolve();
                        }
                    }, 15000);
                }
            });
        }

        // Função para verificar se o frontend está pronto
        function checkFrontend() {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    const iframe = document.getElementById('app-frame');
                    
                    try {
                        // Tentar acessar o conteúdo do iframe
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc && iframeDoc.body) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    } catch (e) {
                        // Ainda não está pronto
                        retryCount++;
                        if (retryCount >= maxRetries) {
                            clearInterval(checkInterval);
                            console.log('Frontend não respondeu, mas continuando...');
                            resolve();
                        }
                    }
                }, 1000);
            });
        }

        // Função para mostrar o aplicativo
        function showApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        }

        // Função principal de inicialização
        async function init() {
            try {
                updateStatus('Preparando ambiente...');
                
                // Iniciar backend
                await startBackend();
                
                updateStatus('Carregando interface...');
                
                // Esperar um pouco para o frontend
                setTimeout(async () => {
                    // Verificar frontend
                    await checkFrontend();
                    
                    updateStatus('Sistema pronto!', 'success');
                    
                    // Mostrar aplicativo
                    setTimeout(() => {
                        showApp();
                    }, 1000);
                }, 3000);
                
            } catch (error) {
                console.error('Erro na inicialização:', error);
                updateStatus(`Erro: ${error.message}`, 'error');
                
                // Mostrar mensagem de erro
                setTimeout(() => {
                    document.getElementById('loading').innerHTML = `
                        <div style="text-align: center; color: #ef4444;">
                            <h2>❌ Erro na Inicialização</h2>
                            <p>${error.message}</p>
                            <p>Verifique se o Node.js está instalado e tente novamente.</p>
                            <button onclick="window.location.reload()" style="
                                background: #2563eb;
                                color: white;
                                border: none;
                                padding: 10px 20px;
                                border-radius: 5px;
                                cursor: pointer;
                                margin-top: 20px;
                            ">Tentar Novamente</button>
                        </div>
                    `;
                }, 2000);
            }
        }

        // Iniciar quando a página carregar
        window.onload = init;

        // Limpar processo ao fechar
        window.onbeforeunload = () => {
            if (backendProcess) {
                console.log('Encerrando backend...');
                backendProcess.kill('SIGTERM');
            }
        };
    </script>
</body>
</html>
